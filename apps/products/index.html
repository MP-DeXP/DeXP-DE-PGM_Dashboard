<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PGM 대시보드 - 제품 관계 인사이트</title>

    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css');
    </style>

    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <link rel="stylesheet" href="../../style.css">
</head>

<body id="page-products">
    <div class="app-container">
        <!-- Sidebar -->
        <nav class="sidebar">
            <!-- Header: Logo + Collapse -->
            <div class="sidebar-header">
                <img src="../../assets/CI.png" alt="mercuryX CI" class="sidebar-logo-ci">
                <img src="../../assets/logo.png" alt="mercuryX" class="sidebar-logo-mark">
                <button class="sidebar-collapse-btn" title="사이드바 접기">
                    <i class="ph ph-arrow-line-left"></i>
                </button>
            </div>

            <div class="sidebar-divider"></div>

            <!-- Nav Links -->
            <ul class="nav-links">
                <li onclick="window.location.href='../brand/'">
                    <span class="nav-icon"><i class="ph ph-buildings"></i></span>
                    <span>구매 활성도</span>
                </li>
                <li class="active" onclick="window.location.href='../products/'">
                    <span class="nav-icon"><i class="ph ph-tag"></i></span>
                    <span>제품 관계 인사이트</span>
                </li>
                <li onclick="window.location.href='../pgm_ops/'">
                    <span class="nav-icon"><i class="ph ph-chart-line-up"></i></span>
                    <span>운영 상태판</span>
                </li>
            </ul>

            <!-- Bottom Actions -->
            <div class="sidebar-bottom">
                <div class="sidebar-bottom-item" id="settings-trigger">
                    <span class="nav-icon"><i class="ph ph-gear"></i></span>
                    <span>설정</span>
                </div>
            </div>
        </nav>

        <main class="main-content">
            <!-- GNB -->
            <header class="top-bar">
                <div class="gnb-left">
                    <div class="gnb-icon"><i class="ph ph-lightbulb"></i></div>
                    <h1 id="page-title">제품 관계 인사이트</h1>
                </div>
                <div class="gnb-right">
                    <div class="gnb-company-badge">
                        <img src="../../assets/logo.png" alt="mercuryX" class="gnb-company-logo">
                        <span class="gnb-company-name">MERCURY X</span>
                        <span class="gnb-company-chevron"><i class="ph ph-caret-down"></i></span>
                    </div>
                    <div class="gnb-avatar">
                        <i class="ph ph-user"></i>
                    </div>
                </div>
            </header>

            <div id="content-area">
                <div id="loading-indicator" class="loading hidden">
                    <div class="spinner"></div>
                    <p>제품 데이터를 불러오는 중...</p>
                </div>
            </div>
        </main>
    </div>

    <script src="../../app.js"></script>
    <script src="../../products.js"></script>
</body>

</html>
