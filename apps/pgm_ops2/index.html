<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PGM 운영 툴</title>
    <link rel="stylesheet" href="./pgm_ops2.css?v=20260420a">
</head>
<body>
    <div class="app-shell">
        <aside class="app-sidebar">
            <div class="app-brand">
                <div class="app-brand-kicker">PGM 운영 툴</div>
                <h1>PGM 운영 툴</h1>
                <p>상품 운영 우선순위와 구조 현황</p>
            </div>
            <nav class="app-nav">
                <button class="app-nav-item is-active" data-view="priority">우선순위</button>
                <button class="app-nav-item" data-view="segments">구조 맵</button>
                <button class="app-nav-item" data-view="detail">상세 보기</button>
                <button class="app-nav-item" data-view="definitions">운영 기준</button>
                <button class="app-nav-item" data-view="health">운영 현황</button>
            </nav>
        </aside>
        <main class="app-main">
            <header class="app-header">
                <div>
                    <div class="app-header-kicker">상품 운영 우선순위</div>
                    <h2 id="page-title">우선순위</h2>
                    <p id="period-note" class="app-header-note">최근 7일 기준으로 화면을 봅니다.</p>
                </div>
                <div class="app-header-meta">
                    <div class="window-toggle" role="tablist" aria-label="기간 기준 선택">
                        <button class="window-toggle-item is-active" data-window-key="7d" type="button">7일 기준</button>
                        <button class="window-toggle-item" data-window-key="1d" type="button">하루 기준</button>
                        <button class="window-toggle-item" data-window-key="30d" type="button">30일 기준</button>
                    </div>
                    <div class="meta-chip">
                        <span>기준일</span>
                        <strong id="as-of-date">-</strong>
                    </div>
                    <div class="meta-chip">
                        <span>데이터 상태</span>
                        <strong id="data-state">로딩 중</strong>
                    </div>
                </div>
            </header>
            <section id="app-root" class="app-root"></section>
        </main>
    </div>
    <script type="module" src="./pgm_ops2.js?v=20260420a"></script>
</body>
</html>
