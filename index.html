<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PGM 대시보드</title>
    <script>
        (function redirectToProductsApp() {
            var query = window.location.search || '';
            var hash = window.location.hash || '';
            var target = 'apps/products/' + query + hash;
            window.location.replace(target);
        })();
    </script>
</head>
<body>
    <p style="font-family: sans-serif; color: #475569; padding: 1rem;">제품 분석 앱으로 이동 중입니다...</p>
